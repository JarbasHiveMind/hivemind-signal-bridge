version: "3.8"

services:
  # signal-cli itself, running as a JSON-RPC daemon. The account must
  # already be registered (see README) before this container is useful;
  # registration is an interactive, one-time step done separately.
  signal-cli:
    image: bbernhard/signal-cli-rest-api:latest  # placeholder -- pin a real
                                                  # signal-cli JSON-RPC image
                                                  # for your deployment
    restart: unless-stopped
    volumes:
      - signal-cli-data:/home/.local/share/signal-cli
      - signal-cli-socket:/signal-cli

  hivemind-signal-bridge:
    build: .
    image: hivemind-signal-bridge
    restart: unless-stopped
    depends_on:
      - signal-cli
    environment:
      # the registered Signal phone number this bridge answers as.
      SIGNAL_ACCOUNT: "${SIGNAL_ACCOUNT}"
      # exactly one of these two ways to reach signal-cli's JSON-RPC:
      SIGNAL_SOCKET: "${SIGNAL_SOCKET:-/signal-cli/socket}"
      SIGNAL_HOST: "${SIGNAL_HOST:-}"
      SIGNAL_PORT: "${SIGNAL_PORT:-}"
      # HiveMind hub credentials, see `hivemind-core add-client`.
      HIVEMIND_ACCESS_KEY: "${HIVEMIND_ACCESS_KEY}"
      HIVEMIND_PASSWORD: "${HIVEMIND_PASSWORD}"
      HIVEMIND_HOST: "${HIVEMIND_HOST:-ws://hivemind-core}"
      HIVEMIND_PORT: "${HIVEMIND_PORT:-5678}"
      HIVEMIND_SITE_ID: "${HIVEMIND_SITE_ID:-signal}"
      HIVEMIND_LANG: "${HIVEMIND_LANG:-en-us}"
    volumes:
      - signal-cli-socket:/signal-cli

volumes:
  signal-cli-data:
  signal-cli-socket:
